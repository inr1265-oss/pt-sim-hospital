<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PT 시뮬레이션 병원</title>
<meta name="description" content="신성대학교 물리치료학과 임상 시뮬레이션 학습 앱 — SOAP 기반 평가와 중재 선택, 국가고시형 문항">
<meta name="theme-color" content="#0B5E3B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body data-screen="auth">
<header class="topbar">
  <div class="brand"><span class="brand-mark">🏥</span><span id="brand-name">PT 시뮬레이션 병원</span></div>
  <nav class="topnav">
    <button data-nav="home">홈</button>
    <button data-nav="hospital">병원</button>
    <button data-nav="records">내 기록</button>
    <button data-nav="admin">관리자</button>
  </nav>
  <div id="profile" class="profile"></div>
</header>
<main>
  <section id="s-auth" class="screen active"></section>
  <section id="s-home" class="screen container"></section>
  <section id="s-hospital" class="screen">
    <div class="hud">
      <div class="hud-left"><span id="hud-floor" class="hud-chip floor"></span><span id="hud-rooms" class="hud-chip"></span></div>
      <div class="hud-mid"><div class="hud-prog"><span id="hud-prog"></span><span id="hud-score"></span></div><div class="progress"><i id="hud-bar"></i></div></div>
      <div class="hud-right"><button id="btn-elev" class="btn small soft">🛗 층 이동</button><button id="btn-quit" class="btn small ghost">종료·채점</button></div>
    </div>
    <div class="vr-stage">
      <nav class="vr-side" aria-label="시뮬레이션 메뉴">
        <button data-nav="home"><span>🏠</span>홈</button>
        <button data-nav="hospital" class="active"><span>🏥</span>병원</button>
        <button data-nav="records"><span>📈</span>기록</button>
        <button id="vr-help"><span>❔</span>조작법</button>
        <button data-nav="admin"><span>⚙️</span>설정</button>
      </nav>
      <div class="map-wrap"><canvas id="map3d" aria-label="3D 병원"></canvas>
        <div class="vr-module" id="vr-module"></div>
        <div class="vr-tools">
          <button id="vr-mic" title="음성으로 문진 질문 (차트 열림 상태에서)">🎤</button>
          <button id="vr-shot" title="화면 캡처 저장">📷</button>
        </div>
      </div>
    </div>
    <p class="map-help small">↑↓(W/S) 걷기 · ←→ 돌기 · 화면 드래그로 둘러보기 · 병실을 클릭하면 침대까지 자동 이동 · <b>침대의 환자를 클릭</b>하면 진료 시작</p>
    <div class="dpad" aria-label="이동 패드">
      <button data-dir="up" aria-label="위">▲</button>
      <button data-dir="left" aria-label="왼쪽">◀</button>
      <button data-dir="ok" aria-label="입장">입장</button>
      <button data-dir="right" aria-label="오른쪽">▶</button>
      <button data-dir="down" aria-label="아래">▼</button>
    </div>
  </section>
  <section id="s-result" class="screen container"></section>
  <section id="s-records" class="screen container"></section>
  <section id="s-admin" class="screen container"></section>
</main>
<nav class="bottom-nav">
  <button data-nav="home"><span>🏠</span>홈</button>
  <button data-nav="hospital"><span>🏥</span>병원</button>
  <button data-nav="records"><span>📈</span>기록</button>
  <button data-nav="admin"><span>🔑</span>관리자</button>
</nav>
<aside id="case-panel" class="panel" aria-live="polite"></aside>
<div id="modal-root"></div>
<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/data/equipment.js"></script>
<script src="js/data/cases_1f.js"></script>
<script src="js/data/cases_2f.js"></script>
<script src="js/data/cases_3f.js"></script>
<script src="js/data/cases_4f.js"></script>
<script src="js/util.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/patient.js"></script>
<script src="js/hospital3d.js"></script>
<script src="js/gemini.js"></script>
<script src="js/session.js"></script>
<script src="js/chart.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
