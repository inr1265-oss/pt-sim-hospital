# app/ 폴더를 GitHub Pages 로 배포 (정적 모드: 계정·성적은 각 브라우저의 localStorage 에 저장)
name: Deploy app to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Inject Gemini key from repository secret (GEMINI_KEY)
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          if [ -n "$GEMINI_KEY" ]; then
            sed -i "s|geminiKey: \"\"|geminiKey: \"$GEMINI_KEY\"|" app/js/config.js
            echo "Gemini key injected"
            # 배포마다 config.js 캐시 무효화(학생 브라우저가 새 설정을 바로 받도록)
            sed -i "s|js/config.js?v=[0-9A-Za-z]*|js/config.js?v=run${GITHUB_RUN_NUMBER}|" app/index.html
          else
            echo "GEMINI_KEY secret not set; AI stays off on the static site"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4